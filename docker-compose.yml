services:
  postgres:
    image: postgres:17-alpine
    container_name: car-rental-postgres
    environment:
      POSTGRES_USER: rental
      POSTGRES_PASSWORD: rental_dev_password
      POSTGRES_DB: car_rental
    ports:
      - "5433:5432" # 5432 занят локальным PostgreSQL
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rental -d car_rental"]
      interval: 5s
      timeout: 3s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: car-rental-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  pgdata:
